name: noc-expiry
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call NOC expiry route
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/noc-expiry"
